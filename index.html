const tagText={must:'固定锚点',weather:'看天气',cost:'预算项'};
const emojis={food:'🍽️',spot:'📍',hotel:'🏡',transport:'🚆',drink:'☕'};
let map=L.map('map',{center:[43.3,141.7],zoom:6,zoomControl:false});L.control.zoom({position:'topright'}).addTo(map);L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:19,attribution:'© OpenStreetMap © CARTO'}).addTo(map);
let layers=[];function clearMap(){layers.forEach(x=>map.removeLayer(x));layers=[]}function markerIcon(c,e){return L.divIcon({className:'',html:`<div style="width:29px;height:29px;border-radius:50%;background:${c};border:2px solid white;display:grid;place-items:center;box-shadow:0 2px 8px #0003;font-size:13px">${e}</div>`,iconSize:[29,29],iconAnchor:[14,14]})}
function showDay(id){clearMap();let ds=id===0?DAYS.slice(1):DAYS.filter(d=>d.id===id),pts=[];ds.forEach(d=>{let line=[];d.locations.forEach(l=>{if(!l.lat)return;pts.push([l.lat,l.lng]);if(l.time!=='—')line.push([l.lat,l.lng]);let m=L.marker([l.lat,l.lng],{icon:markerIcon(d.color,emojis[l.type]||'•')}).addTo(map).bindPopup(`<b>${l.name}</b><br><span style="color:#777">${d.label} · ${l.time==='—'?'备选':l.time}</span><br>${l.desc}`);layers.push(m)});if(id!==0&&line.length>1){let p=L.polyline(line,{color:d.color,weight:2.5,opacity:.55,dashArray:'6,5'}).addTo(map);layers.push(p)}});if(pts.length)map.fitBounds(pts,{padding:[28,28],maxZoom:id===0?6:13})}
function enc(s){return encodeURIComponent(s)}function nav(l){let u=`https://www.google.com/maps/search/?api=1&query=${l.lat},${l.lng}`;window.open(u,'_blank')}function xhs(l){window.open(`https://www.xiaohongshu.com/search_result?keyword=${enc(l.xhsKeyword||l.name)}`,'_blank')}function dp(l){window.open(`https://m.dianping.com/searchshop?keyword=${enc(l.dianpingKeyword||l.name)}`,'_blank')}
function card(l){let tags=(l.tags||[]).map(t=>`<span class="chip ${t}">${tagText[t]}</span>`).join('');if(l.budget)tags+=`<span class="chip cost">${l.budget}</span>`;let links=`<button class="btn nav" onclick='nav(${JSON.stringify(l)})'>导航</button>`;if(l.type==='food'||l.dianpingKeyword)links+=`<button class="btn dp" onclick='dp(${JSON.stringify(l)})'>大众点评</button>`;if(l.xhsKeyword)links+=`<button class="btn xhs" onclick='xhs(${JSON.stringify(l)})'>小红书</button>`;if(l.reserve)links+=`<a class="btn rsv" target="_blank" href="${l.reserve}">官网/预约</a>`;return `<div class="item"><div class="tdot ${l.type}"></div><div class="card"><div class="time">${l.time==='—'?'可替换备选':l.time}</div><div class="name">${l.name}</div><div class="desc">${l.desc}</div>${tags}<div class="links">${links}</div>${l.detail?`<div class="detail">${l.detail}</div>`:''}</div></div>`}
function overview(){return `<section class="hero"><div class="eyebrow">REFERENCE ITINERARY · 2 TRAVELERS</div><h1>北海道雪国小屋旅行</h1><p>2027.01.21—01.30 · 札幌 / 小樽 / 洞爷湖 / 砂川 / 旭川 / 美瑛 / 富良野</p></section><div class="grid"><div class="info"><div class="label">住宿</div><div class="value">9晚 · 6个住宿点<br>3晚札幌 + 1洞爷 + 2旭川 + 1美瑛 + 1富良野 + 1羽田</div></div><div class="info"><div class="label">预算</div><div class="value">住宿目标 ¥7,920–8,570<br>另留 ¥400–700 税费/波动</div></div><div class="info"><div class="label">核心体验</div><div class="value">和服袴 · 湖景木屋<br>SHIRO调香 · 企鹅散步 · 雪丘民宿 · 拖挂小屋</div></div><div class="info"><div class="label">交通</div><div class="value">JR + 巴士 + 必要出租车<br>两段宅急便轻装移动</div></div></div><div class="section">先看这三件事</div><div class="notice warn"><strong>2027班次：</strong>动物园开园时间已公布，但跨城JR、SHIRO接驳、冬季观光巴士和富良野机场巴士仍要在2026年10–12月复核。图中时间是安全占位，不是车票。</div><div class="notice warn"><strong>SHIZENTOYA：</strong>先订可免费取消，再在Booking消息里确认接送、卧室供暖、全部费用、湖景遮挡和浴池是否天然温泉；未确认前不要叫“私汤温泉”。</div><div class="notice good"><strong>两只大箱：</strong>1/24札幌→旭川酒店；1/27旭川→新千岁机场。两段都要先取得收件方和寄件酒店确认，再交寄并拍运单。</div><div class="section">每天路线</div>${DAYS.slice(1).map(d=>`<div class="card day-link" onclick="go(${d.id})"><div class="name"><span class="dot" style="background:${d.color}"></span>${d.label} · ${d.title}</div><div class="sub">${d.date}</div></div>`).join('')}<div class="section">费用口径</div><div class="notice"><strong>住宿总预算按“最终付款页”计算。</strong>截图若写“不包含10%增值税”，则房价×1.10；另检查清洁费、服务费、北海道住宿税。Villa官网说明住宿税需现场现金支付。城市酒店价格用去哪儿下单时的含税总价替换。</div><div class="section">这次主动删掉</div><div class="notice">不滑雪；不去神威岬。祝津展望台冬季最后10分钟是积雪结冰陡坡，会挤掉和服与堺町；定山溪「崖の上」从札幌市区往返约需半天；函馆山和两家六花亭都留给下一趟函馆专线——本次硬加函馆至少要牺牲旭川、美瑛或富良野的一段。保留一条顺滑主线，换来三晚特色住宿和更少拖箱。</div><div class="section">图例</div><div class="legend"><span class="ls">景点</span><span class="lf">吃饭</span><span class="lh">住宿</span><span class="lt">交通</span></div><div class="section">核对来源</div><div class="notice source"><a target="_blank" href="https://factory.shiro-shiro.jp/access/">SHIRO工厂与接驳</a> · <a target="_blank" href="https://www.princehotels.co.jp/shinfurano/restaurant/contents/morinotokei20th/">森之时计</a> · <a target="_blank" href="https://www.city.otaru.lg.jp/docs/2020100900664/">祝津展望台</a> · <a target="_blank" href="https://334.co.jp/ropeway/price/">函馆山缆车</a> · <a target="_blank" href="https://www.rokkatei.co.jp/shop/hakodate/">函馆六花亭</a> · <a target="_blank" href="https://siaf.jp/2027/about/">札幌国际艺术祭2027</a> · <a target="_blank" href="https://www.city.asahikawa.hokkaido.jp/asahiyamazoo/event/event.html">旭山动物园2027开园日历</a> · <a target="_blank" href="https://bieiyasasiimado.com/">Villa美瑛官网</a> · <a target="_blank" href="https://furano-den.com/access/">Den官网</a></div>`}
function normalizeOverview(html){return html.replace('住宿目标 ¥7,920–8,570<br>另留 ¥400–700 税费/波动','住宿目标 CNY 7,920–8,570<br>另留 CNY 400–700 税费/波动').replace('先看这三件事','先看四件事').replace('<div class="section">每天路线</div>','<div class="notice warn"><strong>三处预约型交通：</strong>美瑛冬季观光巴士/包车、富良野→新千岁预约巴士、两段宅急便必须提前落实；机票部分按现有订单不变。</div><div class="section">每天路线</div>').replace('城市酒店价格用去哪儿下单时的含税总价替换。','城市酒店价格用去哪儿下单时的含税总价替换。该区间仅为房费；JR、出租车、两次宅急便、和服、餐饮门票、住宿税、清洁费及汇率波动另计。')}
function renderDay(d){let main=d.locations.filter(l=>l.time!=='—'),alt=d.locations.filter(l=>l.time==='—');return `<div class="day-head"><h2>${d.title}</h2><p>${d.date}</p></div><div class="route"><strong>当天动线</strong>\n${d.route}</div><div class="section">主行程</div><div class="timeline">${main.map(card).join('')}</div>${alt.length?`<div class="section">天气/体力备选</div><div class="timeline">${alt.map(card).join('')}</div>`:''}`}
const tabs=document.getElementById('tabs'),content=document.getElementById('content');DAYS.forEach(d=>{let b=document.createElement('button');b.className='tab'+(d.id===0?' active':'');b.textContent=d.label;b.dataset.id=d.id;b.onclick=()=>go(d.id);tabs.appendChild(b)});function go(id){tabs.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',+b.dataset.id===id));content.innerHTML=id===0?normalizeOverview(overview()):renderDay(DAYS.find(d=>d.id===id));showDay(id);tabs.querySelector(`[data-id="${id}"]`).scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});window.scrollTo({top:document.getElementById('map').offsetTop,behavior:'smooth'})}go(0);
</script>
